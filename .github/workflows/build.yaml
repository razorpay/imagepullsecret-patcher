name: Credstash CI
on: [push]

jobs:
  Build-Docker-Image:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
    runs-on: 
      - k8s-runner
      - non-api
      - ${{ matrix.platform }}
    steps: 
      - name: Build Multi-Arch Image
        uses: razorpay/docker-image-build-push@v1
        with:
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
          registry: c.rzp.io
          enable-login: true
          repository: imagepullsecret-patcher
          file: Dockerfile
          push: true
          suffix: -${{ matrix.platform }}
          build-args: GIT_COMMIT_HASH=${{ github.sha }}

  Build-Multi-Arch-Manifest:
    needs:
      - Build-Docker-Image
    runs-on:
      - k8s-runner
      - non-api
    steps:
      - name: Build Multi-Arch Manifest
        uses: razorpay/docker-image-build-push@v1
        with:
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
          registry: c.rzp.io
          enable-login: true
          repository: imagepullsecret-patcher
          custom-tag: ${{ github.sha }}
          file: Dockerfile
          trigger-multiarch-image-build: true
          multiarch-suffixes: |
            -linux-amd64
            -linux-arm64

